# Controlled local integration check. Not a hosted production configuration.
Foreground yes
DatabaseDirectory /var/lib/clamav
TCPSocket 3310
TCPAddr 0.0.0.0
PidFile /tmp/clamd.pid
TemporaryDirectory /tmp
StreamMaxLength 25M
MaxFileSize 25M
MaxScanSize 100M
MaxRecursion 8
MaxFiles 1000
MaxThreads 2
MaxQueue 4
ReadTimeout 30
CommandReadTimeout 10
ScanPDF yes
ScanArchive yes
AlertExceedsMax yes
AlertEncrypted yes
